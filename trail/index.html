<!doctype html>
<!-- ==========================================================================
     THE CLIMATE TRAILWAY
     ==========================================================================
     A learning trail into climate action, laid out like a state park.
     Start at the Trailhead and pick a way of helping (one of six trails),
     follow markers 1 to 4 to the Climate Pavilion (one of nine exhibits),
     take the shared Return Trail (markers 5 to 7) to bring it close to
     home, and end at the Visitor Center to take home a Field Guide.
     trail.js draws everything from data/ and the shared core files; this
     file holds only the page shell and the icon set.
     The Climate Trailway, at climatetrailway.com/trail/ (stewardshiptrail.com
     forwards here). This folder, trail/, sits in the climate-trailway
     repository beside core/, the shared core (colors, ways of helping, the
     base stylesheet), served at /core/, so one change there reaches every
     Climate Trailway experience. The Climate Trailway is a project of Kinfeather.
     CORE below is the one place that address is written.
     ========================================================================== -->
<html lang="en" class="loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content Security Policy: the only places allowed to supply code,
     styles, fonts, and images: this site (which also serves the shared
     core) and Google Fonts. Anything else is refused by the browser.
     The two sha256 values are fingerprints of the two small inline
     scripts below (the import map and the old-browser check). If either
     script changes by even one character, its fingerprint must be
     recomputed, or the browser will block it and the page won't load. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-eKS57ORtXElXx8BapCqYpXOySifH/nbY3S5v8ltVwiE=' 'sha256-sSIOhr4FBqA/5Y5NTZIIxFrusfaSpXmjFzS691E+qXY='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Climate Trailway</title>
<!-- What shows when the link is shared: in texts, email, and social posts.
     The image is images/share.png (1200 x 630). -->
<meta name="description" content="A free, self-guided learning experience that helps you find your place in the climate movement. Pick your trail, learn your way of caring, and leave with a Field Guide to climate action.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Climate Trailway">
<meta property="og:title" content="Climate Trailway">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A park map of the Climate Trailway: six colored trails from the Trailhead to the Climate Pavilion, and a Return Trail to the Visitor Center.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Varela+Round&display=swap" rel="stylesheet">
<!-- CORE: the shared Climate Trailway files. The import map lets trail.js
     write "trailway/climate-trailway.js"; change both lines together. -->
<script type="importmap">{ "imports": { "trailway/": "/core/" } }</script>
<link rel="stylesheet" href="/core/atlas.css">
<link rel="stylesheet" href="trail.css">
</head>

    <!-- The Visitor Center: a building with an "i" for information. -->
    <symbol id="i-center" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5"/><path d="M5 9v11.5h14V9"/><path d="M12 13.5v4.5"/><path d="M12 10.6v.1"/></symbol>
    <symbol id="i-guide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/><path d="M14.5 6.5c-2.8.3-4.5 2.2-4.5 5.5 3.2-.2 4.8-2.2 4.5-5.5z"/><path d="M10 12l2.2-2.2"/></symbol>

<header class="page-header">
    <h1><span id="title">Climate Trailway</span></h1>
    <p class="by" id="by"></p>
    <p class="lede" id="lede">Find your way into the climate movement!</p>
    <!-- Shown only when the trail can't run: scripts are off, or the
         browser is too old for the import map (before about 2023). -->
    <noscript><p class="no-run">The Climate Trailway needs JavaScript to run. Please turn it on, update your browser, or try another device.</p></noscript>
    <p class="no-run" id="noRun" hidden>The Climate Trailway needs a newer browser. Please update your browser or try another device.</p>
    <script>if (!(window.HTMLScriptElement && HTMLScriptElement.supports && HTMLScriptElement.supports("importmap"))) document.getElementById("noRun").hidden = false;</script>
    <div class="todo" id="todo"></div>
    <div class="pace" id="note"></div>
</header>

<!-- The progress bar: filled in by trail.js once a trail is picked. -->
<nav class="progress" id="progress" aria-label="Your progress" hidden></nav>

<main class="trail-page">
    <!-- The Trailhead's shell is written here, with the trail picker on
         its board; its sign comes from the places in data/. trail.js adds
         markers 1-4, the Climate Pavilion, the Return Trail (markers 5-7),
         and the Visitor Center at the end. -->
    <ol class="line" id="start">
        <li class="stop place is-trailhead" id="trailhead">
            <span class="marker" aria-hidden="true" id="trailheadMarker"></span>
            <div id="trailheadSign"></div>
            <div class="place-board">
                <section id="board"></section>
                <section class="pick-body" id="pick" aria-labelledby="pickTitle">
                    <h3 class="board-h" id="pickTitle"></h3>
                    <p class="step-hint" id="pickHint"></p>
                    <!-- "Find your trail": optional questions, filled in by trail.js. -->
                    <div id="pickHelp"></div>
                    <ul class="options" id="trailOpts"></ul>
                </section>
            </div>
        </li>
    </ol>
    <ol class="line" id="trailStops"></ol>
    <ol class="line" id="lodgeLine"></ol>
    <ol class="line" id="backStops"></ol>
    <ol class="line" id="finishLine"></ol>
    <!-- The Field Guide, built for printing and downloading only. -->
    <div class="keepsake" id="keepsake" hidden></div>
</main>
<!-- Feedback: near the trail but not part of it. Filled in by trail.js. -->
<section class="feedback-zone" id="feedback" aria-label="Feedback"></section>
<footer class="site-foot" id="siteFoot"></footer>
<script type="module" src="trail.js"></script>
</body>
</html>

<!doctype html>
<!-- ==========================================================================
     THE CLIMATE COLOR TRAIL
     ==========================================================================
     A learning trail into climate action. Pick a way of helping (a trail)
     at the Trailhead, follow four stops, pick a topic in the Lodge
     (exhibits A-I), take a Field Guide, and end at the Bulletin Board.
     trail.js draws everything from data/ and the shared core files; this
     file holds only the page shell and the icon set.
     Part of Climate Color, at climatecolor.com/trail/ (stewardshiptrail.com
     forwards here). This folder, trail/, sits in the climate-color
     repository beside core/, the shared core (colors, ways of helping, the
     base stylesheet), served at /core/, so one change there reaches every
     Climate Color experience. Climate Color is a project of Kinfeather.
     CORE below is the one place that address is written.
     ========================================================================== -->

     core) and Google Fonts. Anything else is refused by the browser.

     scripts below (the import map and the old-browser check). If either
     script changes by even one character, its fingerprint must be
     recomputed, or the browser will block it and the page won't load. -->

<header class="page-header">

         browser is too old for the import map (before about 2023). -->

</header>

<!-- The progress bar: filled in by trail.js once a trail is picked. -->

<main class="trail-page">
    <p class="test-note" id="testNote"></p>
    <!-- The Trailhead's shell is written here, with the trail picker on its
         board; its sign comes from the places in data/. trail.js adds
         stops 1-4, then the Lodge, the Field Guide, and the Bulletin Board. -->
    <ol class="line" id="start">
        <li class="stop place is-trailhead" id="trailhead">
            <span class="marker" aria-hidden="true" id="trailheadMarker"></span>
            <div id="trailheadSign"></div>
            <div class="place-board">
                <section id="board"></section>
                <section class="pick-body" id="pick" aria-labelledby="pickTitle">
                    <h3 class="board-h" id="pickTitle"></h3>
                    <p class="step-hint" id="pickHint"></p>
                    <ul class="options" id="trailOpts"></ul>
                    <div id="trailBox" aria-live="polite"></div>
                </section>
            </div>
        </li>
    </ol>
    <ol class="line" id="trailStops"></ol>
    <ol class="line" id="lodgeLine"></ol>

    <p class="footnote" id="footnote"></p>
</main>

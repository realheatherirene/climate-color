<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stewardship Wheel | Climate Color</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Varela+Round&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../core/atlas.css">
    <link rel="stylesheet" href="wheel.css">
</head>
<body>
    <!-- Header -->
    <header class="page-header">
        <div>
            <h1>Stewardship Wheel</h1>
        </div>
    </header>

    <!-- The words come from core/climate-color.js and the wheel from
         core/wheel.js, filled in by wheel.js. A tap on a color shows its
         card in #wheelCard, with a button to the color's page. On phones the wheel comes first, right under
         the header, with the card opening just below it. On wider screens
         the words sit on the left and the wheel on the right (wheel.css). -->
    <main class="wheel-page" id="wheelPage">
        <div class="wheel-main" id="wheel"></div>
        <div class="wheel-card" id="wheelCard"></div>
        <p class="wheel-lead" data-wheel-text="short"></p>

        <div class="wheel-about">
            <section class="wheel-section">
                <h2 data-wheel-text="how.title"></h2>
                <p data-wheel-text="how.body"></p>
            </section>

            <section class="wheel-section">
                <h2 data-wheel-text="why.title"></h2>
                <p data-wheel-text="why.body"></p>
            </section>
        </div>

        <p class="wheel-next">
            <a class="pill-btn pill-all next-btn" href="wheel-faq.html">Read the Wheel FAQ <span aria-hidden="true">&rarr;</span></a>
        </p>
    </main>

    <script type="module" src="wheel.js"></script>
    <!-- Tells the Squarespace page how tall this page is, so its box fits. -->
    <script src="../core/iframe-resize.js"></script>
</body>
</html>

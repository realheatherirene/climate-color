<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Pathways | Climate Color</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ADLaM+Display&family=Varela+Round&display=swap" rel="stylesheet">

  <!-- Global & Pathway Styles -->
  <link rel="stylesheet" href="../core/atlas.css">
  <link rel="stylesheet" href="pathways.css">
</head>

<body>
  <header class="page-header">
    <h1>The Pathways</h1>
    <p>a <strong>page</strong> for each of the <strong>six colors</strong> on the <strong>Stewardship Wheel</strong></p>
  </header>

  <main class="pathway-wrapper">

    <!-- Points newcomers to the Wheel page; pathways.js fills in the link
         from core/climate-color.js. -->
    <p class="pathway-intro">New here? <a data-site="wheel" target="_top">Start with the Stewardship Wheel <span aria-hidden="true">&rarr;</span></a></p>

    <!-- One card per color, in list order, drawn by pathways.js from
         core/color-card.js. Each card's button opens that color's page. -->
    <div class="pathway-grid" id="pathway-cards"></div>

    <!-- Closing note -->
    <section class="pathway-section pathway-closing">
      <p>
        You don’t need to fit into one Pathway.<br>
        You don’t need to choose.<br>
        You don’t need to stay the same.<br>
        <strong>These are simply ways to know yourself with gentleness and clarity.</strong>
      </p>
    </section>

  </main>
  <script type="module" src="pathways.js"></script>
  <!-- Tells the Squarespace page how tall this page is, so its box fits. -->
  <script src="../core/iframe-resize.js"></script>
</body>
</html>
